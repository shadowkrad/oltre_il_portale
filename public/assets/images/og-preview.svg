<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#9d4edd" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3c096c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05060b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#05060b"/>
  <circle cx="600" cy="315" r="450" fill="url(#portalGlow)"/>

  <!-- Mystic Runes and Frame -->
  <circle cx="600" cy="315" r="220" fill="none" stroke="#9d4edd" stroke-width="3" stroke-dasharray="15,10" opacity="0.6"/>
  <circle cx="600" cy="315" r="160" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>

  <!-- Text -->
  <text x="600" y="270" text-anchor="middle" font-family="'Cinzel', serif, sans-serif" font-size="64" font-weight="900" fill="url(#titleGrad)" letter-spacing="6">OLTRE IL PORTALE</text>
  <text x="600" y="340" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="24" font-weight="600" fill="#e2e8f0" letter-spacing="8">SERVER MINECRAFT FANTASY &amp; SOTTOMONDO</text>
  
  <!-- Server IP Pill -->
  <rect x="380" y="400" width="440" height="65" rx="32" fill="#0c1020" stroke="#00f0ff" stroke-width="2"/>
  <text x="600" y="442" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" font-weight="700" fill="#00f0ff" letter-spacing="2">minecraft.guidelli.net:25565</text>
</svg>
