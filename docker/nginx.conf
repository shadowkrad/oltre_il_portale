server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Asset con hash nel nome: cache lunga
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Servizio «Il muro scrive». Se l'api e' spenta nginx parte comunque (risoluzione a ogni richiesta).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 1k;
        proxy_read_timeout 10s;
    }

    # Le pagine HTML si ricontrollano sempre: dopo un aggiornamento nessuna pagina resta nella vecchia versione.
    location / {
        expires -1;
        try_files $uri $uri/index.html =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    error_page 404 /404.html;
}
